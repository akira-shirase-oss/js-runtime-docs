# What every change to the docs must pass, and what runs each night against js-runtime main:
#
#   build      the site builds; every internal link resolves (starlight-links-validator fails the
#              build); the search index, llms.txt, each page's Markdown copy and the changelog feed
#              are in the output; no private names or paths are in it.
#   links      every external link in the built site answers.
#   privacy    the built site contacts no other host and persists nothing about a reader.
#              Accessibility runs on the same pages in the same browser.
#   surface    surface.json covers every rt.* name, CLI flag and manifest key the product declares,
#              and declares none it doesn't — checked both ways against js-runtime main.
#   coverage   every code block on every page runs, is a checked output, or says why it can't (not-run).
#   snippets   jsrt is built from js-runtime main with the quick start's own commands; then every
#              example on the pages runs, in order, and its output must match what the page shows
#              (ids, times, pids, ports and hashes normalised).
name: ci

on:
  push:
    branches: [main, 'docs/**'] # docs/** so a branch is checked before review
  pull_request:
  schedule:
    - cron: '41 5 * * *' # nightly: catch js-runtime main moving under the docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (links, search, llms.txt, Markdown copies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Every code block runs, is a checked output, or says why not
        run: node scripts/snippets.mjs --coverage
      - name: Build, validate internal links, check the output
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          retention-days: 7

  links:
    name: external links
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 20
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude '^https://docs\.jsrt\.404human\.dev'
            --exclude '^https://github\.com/akira-shirase-oss/js-runtime-docs/(edit|issues/new)'
            --exclude '^https://app\.example\.com'
            --root-dir ${{ github.workspace }}/dist
            'dist/**/*.html'
          fail: true

  privacy:
    name: privacy (no third-party hosts; nothing persisted about a reader)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - name: Serve the built site and check every request it makes
        run: |
          npx astro preview --port 4321 --host 127.0.0.1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:4321/ && break; sleep 1; done
          PREVIEW=http://127.0.0.1:4321 node scripts/check-privacy.mjs
          # Accessibility on the same build: the helper first proves it fails a known-bad fixture,
          # then every sitemap page passes.
          PREVIEW=http://127.0.0.1:4321 node scripts/axe-scan.check.mjs

  surface:
    name: surface.json covers rt.*, the CLI flags and the manifest keys, both ways
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check out js-runtime main for the declared surface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: akira-shirase-oss/js-runtime
          path: js-runtime
          persist-credentials: false
      - name: Every name in surface.json; no name the product lacks
        run: JSRT_DIR=js-runtime node scripts/check-rt.mjs

  snippets:
    name: examples run against js-runtime main
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check out js-runtime main to build jsrt from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: akira-shirase-oss/js-runtime
          path: .snippets/work/js-runtime
          persist-credentials: false
      - name: The steps the pages run, in order
        run: node scripts/snippets.mjs --list
      # The quick start's own install step runs rustup against the product's rust-toolchain.toml
      # (1.99.1) and cargo build --release -p jsrt under .snippets/work — the same commands the
      # page shows a reader. The first build downloads ~95 MB of prebuilt V8 for deno_core; the
      # cache below, keyed on the product's Cargo.lock, keeps it out of every run after the first.
      - name: Install the pinned Rust toolchain the product asks for
        run: |
          rustup --version
          rustup toolchain install || rustup show
          cargo --version
        working-directory: .snippets/work/js-runtime
      - name: Cache the product build, keyed on its Cargo.lock
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .snippets/work/js-runtime
          key: jsrt-${{ hashFiles('.snippets/work/js-runtime/Cargo.lock') }}
      - name: Run every example against the real binary
        run: node scripts/snippets.mjs
      - name: The run directory, if anything failed
        if: failure()
        run: find .snippets -name '*.log' -o -name '*.out' -o -name '*.err' | head -30 && tail -100 .snippets/run/*.out 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: snippets
          path: .snippets/run/
          if-no-files-found: ignore
          retention-days: 7
